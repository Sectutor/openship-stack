# OpenShip — AppVault curated stack (self-hosted deployment platform)
#
# Diff vs upstream (oblien/openship docker/docker-compose.yml):
#   - env baked inline (no env_file ../.env, no ${VAR:?} required vars)
#   - OPENSHIP_PUBLIC_URL injected by the AppVault agent at install time
#   - one-shot `setup` sidecar bootstraps the first admin via the
#     internal-token-gated POST /api/system/bootstrap-admin endpoint
#   - edge (OpenResty :80/:443, host network) REMOVED — AppVault clients run
#     Caddy on 80/443. The API still boots in OPENSHIP_EDGE_MODE=docker;
#     domain routing on this box works if you run an edge container named
#     `openship_edge` yourself. Deploy to remote servers (SSH) works as-is.
#
# Default admin (first boot, auto-created): admin@openship.local / Openship2026!

name: openship

services:
  postgres:
    image: postgres:16-alpine
    container_name: openship_postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: openship
      POSTGRES_PASSWORD: openship
      POSTGRES_DB: openship
    # PRIVATE: not published to the host. api reaches it at postgres:5432.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openship -d openship"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: openship_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: ghcr.io/oblien/openship-api:latest
    container_name: openship_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    # Host Docker socket -> the API (dockerode) builds + runs deployed apps on
    # the host daemon. The api container is therefore host-privileged through
    # the socket — run it only on a trusted host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "4000"
      CLOUD_MODE: "false"
      DEPLOY_MODE: docker
      OPENSHIP_REQUIRE_AUTH: "true"
      DATABASE_URL: postgresql://openship:openship@postgres:5432/openship
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: 330de22860d8f25894f14370cc659585236fe1cc782c82aa818b3c6feb926f0c
      INTERNAL_TOKEN: b496d1fd61400edb60d9dfb861cb851dc45ee9a4995f1b2c3b23703e4928c98b
      # AppVault agent injects the real per-client origin at install time
      # (same mechanism as SERVER_URL for Twenty). Set it manually when
      # running this compose by hand, or remote login is rejected (403
      # ORIGIN_REJECTED).
      OPENSHIP_PUBLIC_URL: ""
      # Edge is NOT part of this stack (Caddy owns 80/443 on AppVault boxes).
      # Docker-edge mode with a documented container name: if you later run an
      # openship-edge container named `openship_edge`, domain routing works.
      OPENSHIP_EDGE_MODE: docker
      OPENSHIP_EDGE_CONTAINER: openship_edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No digit:digit sequences (e.g. 127.0.0.1:4000 / r.ok?0:1) — old agent
      # port-conflict remappers matched those globally and corrupted the
      # healthcheck (OpenShip incident). localhost + if/else exit avoid it.
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:4000/api/health').then(r=>{if(r.ok){process.exit(0)}process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  dashboard:
    image: ghcr.io/oblien/openship-dashboard:latest
    container_name: openship_dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    # node-based healthcheck against the api's DNS name: the dashboard image
    # ships node but NO curl/bun, wget resolves localhost to ::1 (server is
    # IPv4-only -> refused), and literal 127.0.0.1:PORT carries digit:digit
    # sequences (old-agent remap corruption). api:4000 has none of those
    # problems and the dashboard only starts after api is healthy anyway.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://api:4000/api/health').then(r=>{if(r.ok){process.exit(0)}process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      - appvault.managed=true
      - appvault.app=openship

  # One-shot first-admin bootstrap (internal-token gated). Exits 0 whether it
  # created the admin or the admin already existed (idempotent across
  # reinstalls; the engine treats stack service failures as non-fatal anyway).
  setup:
    image: curlimages/curl:latest
    container_name: openship_setup
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        sleep 5
        curl -fsS -X POST http://api:4000/api/system/bootstrap-admin \
          -H "Content-Type: application/json" \
          -H "X-Internal-Token: b496d1fd61400edb60d9dfb861cb851dc45ee9a4995f1b2c3b23703e4928c98b" \
          -d '{"name":"Admin","email":"admin@openship.local","password":"Openship2026!"}' \
          && echo OPENSHIP_ADMIN_BOOTSTRAPPED \
          || echo OPENSHIP_ADMIN_BOOTSTRAP_SKIPPED_OR_FAILED

volumes:
  postgres_data:
  redis_data:
